<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | InterviewCoach AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #080b14;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glow {
            position: fixed;
            width: 450px;
            height: 450px;
            background: #5b3df5;
            filter: blur(180px);
            opacity: 0.18;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
            position: relative;
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            color: #8c75ff;
        }

        .card {
            background: rgba(17, 22, 36, 0.95);
            border: 1px solid #272c3d;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        .card h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9295a3;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c6c8d2;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0b0f1b;
            border: 1px solid #2b3040;
            border-radius: 9px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #7c5cff;
            box-shadow: 0 0 0 3px rgba(124,92,255,0.12);
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 22px;
            color: #9b8aff;
            text-decoration: none;
            font-size: 13px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #7c5cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #6b4bea;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124,92,255,0.25);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #555b6e;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            flex: 1;
            background: #292e3e;
        }

        .register {
            text-align: center;
            color: #9295a3;
            font-size: 14px;
        }

        .register a {
            color: #9b8aff;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #777c8d;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

    <div class="container">

        <div class="logo">
            Interview<span>Coach</span> AI
        </div>

        <div class="card">

            <h1>Welcome back 👋</h1>

            <p class="subtitle">
                Sign in to continue your interview preparation.
            </p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <a href="#" class="forgot">
                    Forgot password?
                </a>

                <button type="submit" class="login-btn">
                    Sign In →
                </button>

            </form>

            <div class="divider">
                OR
            </div>

            <div class="register">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>

        </div>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Login system will be connected to Firebase soon!");

        });
    </script>

</body>
</html>
