<!DOCTYPE html>
<html>
<head>
  <title>Performance | InterviewCoach AI</title>
  <style>
    *{box-sizing:border-box;font-family:Arial}
    body{margin:0;background:#080b14;color:white}
    .side{position:fixed;width:220px;height:100vh;background:#0d111d;padding:25px}
    .side span{color:#8c75ff}
    .side a{display:block;color:#aaa;text-decoration:none;padding:13px;margin:5px 0}
    .side a:hover,.active{background:#171b2b;border-radius:8px;color:white!important}
    main{margin-left:220px;padding:40px}
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
    .card{background:#111624;border:1px solid #202535;border-radius:12px;padding:20px}
    .bar{height:8px;background:#292e40;border-radius:10px;margin-top:10px}
    .fill{height:100%;background:#7c5cff;border-radius:10px}
    @media(max-width:700px){
      .side{position:relative;width:100%;height:auto}
      main{margin:0;padding:20px}
      .cards{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<div class="side">
  <h2>Interview<span>Coach</span> AI</h2>
  <a href="dashboard.html">🏠 Dashboard</a>
  <a href="interview-setup.html">🎤 Practice Interview</a>
  <a href="performance.html" class="active">📊 Performance</a>
  <a href="history.html">📝 History</a>
  <a href="profile.html">👤 Profile</a>
  <a href="settings.html">⚙️ Settings</a>
  <a href="index.html">↪ Logout</a>
</div>

<main>
  <h1>My Performance 📊</h1>
  <p>Track your interview skills and improvement.</p>

  <div class="cards">

    <div class="card">
      <h3>Communication</h3>
      <h2>88%</h2>
      <div class="bar"><div class="fill" style="width:88%"></div></div>
    </div>

    <div class="card">
      <h3>Technical Knowledge</h3>
      <h2>82%</h2>
      <div class="bar"><div class="fill" style="width:82%"></div></div>
    </div>

    <div class="card">
      <h3>Problem Solving</h3>
      <h2>76%</h2>
      <div class="bar"><div class="fill" style="width:76%"></div></div>
    </div>

    <div class="card">
      <h3>Confidence</h3>
      <h2>72%</h2>
      <div class="bar"><div class="fill" style="width:72%"></div></div>
    </div>

  </div>
</main>

</body>
</html>
