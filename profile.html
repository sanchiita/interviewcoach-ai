<!DOCTYPE html>
<html>
<head>
  <title>Profile | InterviewCoach AI</title>
  <style>
    *{box-sizing:border-box;font-family:Arial}
    body{margin:0;background:#080b14;color:white}
    .side{position:fixed;width:220px;height:100vh;background:#0d111d;padding:25px}
    .side span{color:#8c75ff}
    .side a{display:block;color:#aaa;text-decoration:none;padding:13px;margin:5px 0}
    .side a:hover,.active{background:#171b2b;border-radius:8px;color:white!important}
    main{margin-left:220px;padding:40px}
    .card{max-width:600px;background:#111624;border:1px solid #202535;border-radius:15px;padding:25px}
    .avatar{width:70px;height:70px;border-radius:50%;background:#7c5cff;
            display:flex;align-items:center;justify-content:center;
            font-size:28px;font-weight:bold;margin-bottom:20px}
    .row{padding:15px 0;border-bottom:1px solid #202535}
    .label{color:#777c8c;font-size:13px;margin-bottom:5px}
    .value{font-size:16px}
    @media(max-width:700px){
      .side{position:relative;width:100%;height:auto}
      main{margin:0;padding:20px}
    }
  </style>
</head>

<body>

<div class="side">
  <h2>Interview<span>Coach</span> AI</h2>

  <a href="dashboard.html">🏠 Dashboard</a>
  <a href="interview-setup.html">🎤 Practice Interview</a>
  <a href="performance.html">📊 Performance</a>
  <a href="history.html">📝 History</a>
  <a href="profile.html" class="active">👤 Profile</a>
  <a href="settings.html">⚙️ Settings</a>
  <a href="index.html">↪ Logout</a>
</div>

<main>
  <h1>My Profile 👤</h1>
  <p>Manage your interview profile.</p>

  <div class="card">

    <div class="avatar">S</div>

    <div class="row">
      <div class="label">Name</div>
      <div class="value" id="userName">Loading...</div>
    </div>

    <div class="row">
      <div class="label">Email</div>
      <div class="value" id="userEmail">Loading...</div>
    </div>

    <div class="row">
      <div class="label">Target Role</div>
      <div class="value">Software Developer</div>
    </div>

    <div class="row">
      <div class="label">Experience</div>
      <div class="value">Fresher</div>
    </div>

    <div class="row">
      <div class="label">Skills</div>
      <div class="value">Python · HTML · CSS · JavaScript</div>
    </div>

  </div>
</main>

</body>
</html>
