<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Performance Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl text-center relative overflow-hidden">
    
    <!-- Top Header Badge -->
    <div class="inline-flex items-center gap-2 px-3 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-semibold rounded-full border border-emerald-500/20 mb-4 uppercase tracking-wider">
      <i class="fa-solid fa-circle-check"></i> Interview Complete
    </div>

    <!-- Overall Score Circle -->
    <div class="my-4">
      <div class="inline-flex flex-col items-center justify-center w-32 h-32 rounded-full border-4 border-emerald-500 bg-slate-800/80 shadow-lg shadow-emerald-500/10">
        <span id="overall-score" class="text-4xl font-extrabold text-white">84</span>
        <span class="text-xs text-slate-400 font-medium">/ 100</span>
      </div>
      <h2 id="performance-label" class="text-xl font-bold text-emerald-400 mt-3">Excellent Performance</h2>
      <p id="interview-stats" class="text-xs text-slate-400 mt-1">Questions: 5 &bull; Average Score: 84%</p>
    </div>

    <!-- Category Breakdown Bars -->
    <div class="space-y-3 text-left my-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
      
      <!-- Communication -->
      <div>
        <div class="flex justify-between text-xs font-medium mb-1">
          <span class="text-slate-300">Communication</span>
          <span id="comm-score" class="text-emerald-400 font-semibold">88%</span>
        </div>
        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
          <div id="comm-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 88%;"></div>
        </div>
      </div>

      <!-- Technical -->
      <div>
        <div class="flex justify-between text-xs font-medium mb-1">
          <span class="text-slate-300">Technical</span>
          <span id="tech-score" class="text-emerald-400 font-semibold">82%</span>
        </div>
        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
          <div id="tech-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 82%;"></div>
        </div>
      </div>

      <!-- Relevance -->
      <div>
        <div class="flex justify-between text-xs font-medium mb-1">
          <span class="text-slate-300">Relevance</span>
          <span id="rel-score" class="text-emerald-400 font-semibold">86%</span>
        </div>
        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
          <div id="rel-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 86%;"></div>
        </div>
      </div>

    </div>

    <!-- AI Summary Box -->
    <div class="bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-left mb-6">
      <div class="flex items-center gap-2 text-xs font-semibold text-indigo-400 mb-2 uppercase tracking-wide">
        <i class="fa-solid fa-wand-magic-sparkles"></i> AI Summary
      </div>
      <p id="ai-summary" class="text-sm text-slate-300 leading-relaxed italic">
        "You're showing strong potential. Focus on giving more specific examples in your answers."
      </p>
    </div>

    <!-- Navigation Action Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="window.location.href='interview.html'" class="py-2.5 px-4 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-semibold rounded-lg transition-colors flex items-center justify-center gap-2">
        <i class="fa-solid fa-rotate-right"></i> Try Again
      </button>
      <button onclick="window.location.href='index.html'" class="py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-chart-line"></i> Dashboard
      </button>
    </div>

  </div>

  <script>
    // Load results dynamic data from LocalStorage if available
    document.addEventListener("DOMContentLoaded", () => {
      const storedResults = localStorage.getItem("latestInterviewResult");

      if (storedResults) {
        try {
          const data = JSON.parse(storedResults);

          // Populate values
          document.getElementById("overall-score").textContent = data.overallScore || 84;
          document.getElementById("performance-label").textContent = data.performanceLabel || "Excellent Performance";
          document.getElementById("interview-stats").textContent = `Questions: ${data.totalQuestions || 5} • Average Score: ${data.overallScore || 84}%`;

          document.getElementById("comm-score").textContent = `${data.communicationScore || 88}%`;
          document.getElementById("comm-bar").style.width = `${data.communicationScore || 88}%`;

          document.getElementById("tech-score").textContent = `${data.technicalScore || 82}%`;
          document.getElementById("tech-bar").style.width = `${data.technicalScore || 82}%`;

          document.getElementById("rel-score").textContent = `${data.relevanceScore || 86}%`;
          document.getElementById("rel-bar").style.width = `${data.relevanceScore || 86}%`;

          if (data.aiSummary) {
            document.getElementById("ai-summary").textContent = `"${data.aiSummary}"`;
          }
        } catch (e) {
          console.error("Error parsing stored interview results", e);
        }
      }
    });
  </script>
</body>
</html>
