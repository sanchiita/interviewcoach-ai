<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Results | InterviewCoach AI</title>
  <style>
    /* basic styling matching your dark theme */
    body {
      background-color: #0f111a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #16192b;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .btn {
      background-color: #6c5ce7;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
    }
    .btn:hover { background-color: #5a4bcf; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Interview Performance Analysis</h1>
    <hr style="border-color: #2e3450;">
    
    <h3>Your Answer:</h3>
    <p id="user-answer-display" style="color: #a0a5c0;"></p>

    <h3>Feedback & Score:</h3>
    <p id="feedback-display">Analyzing your responses...</p>

    <button class="btn" onclick="window.location.href='interview.html'">Practice Next Question</button>
  </div>

  <script>
    // Load saved answer from browser storage
    const savedAnswer = localStorage.getItem('currentUserAnswer');
    if (savedAnswer) {
      document.getElementById('user-answer-display').textContent = savedAnswer;
    } else {
      document.getElementById('user-answer-display').textContent = "No answer provided.";
    }
  </script>
</body>
</html>
